name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unpack project
        run: |
          test -f HerBrowser-1.7.zip || { echo "::error::Upload HerBrowser-1.7.zip to the repository root"; exit 1; }
          rm -rf app/src app/build.gradle build.gradle settings.gradle gradle.properties
          unzip -q -o HerBrowser-1.7.zip
          test -f app/build.gradle || { echo "::error::app/build.gradle missing after unzip"; exit 1; }

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare HerBrowser ZIP
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Release APK not found"; exit 1; }
          mkdir -p package
          cp "$APK" package/HerBrowser.apk
          (cd package && zip -q -r ../HerBrowser.zip HerBrowser.apk)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-APK
          path: package/HerBrowser.apk

      - name: Upload HerBrowser ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-ZIP
          path: HerBrowser.zip
