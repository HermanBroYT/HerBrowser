name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HerBrowser APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          # Normally the Android project is stored directly in the repository.
          # If a project ZIP is supplied, unpack its project root first.
          if [[ -f "HerBrowser-project.zip" ]]; then
            TEMP_PROJECT="$RUNNER_TEMP/herbrowser-project"
            mkdir -p "$TEMP_PROJECT"
            unzip -q -o "HerBrowser-project.zip" -d "$TEMP_PROJECT"

            SETTINGS_FILE="$(find "$TEMP_PROJECT" -type f -name settings.gradle -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::settings.gradle was not found inside HerBrowser-project.zip."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
              echo "::error::app/build.gradle was not found beside settings.gradle."
              exit 1
            fi

            cp -a "$PROJECT_DIR/." .
          fi

          if [[ ! -f "settings.gradle" || ! -f "app/build.gradle" ]]; then
            echo "::error::Android project files are missing. Put settings.gradle and app/build.gradle in the repository root, or add HerBrowser-project.zip."
            exit 1
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Build finished without producing a release APK."
            exit 1
          fi
          echo "Successfully created: $APK"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-Android-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
