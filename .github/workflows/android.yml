name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unpack project
        run: |
          test -f HerBrowser-project.zip || { echo "::error::Upload HerBrowser-project.zip to the repo root"; exit 1; }
          rm -rf app/src app/build.gradle build.gradle settings.gradle gradle.properties
          unzip -q -o HerBrowser-project.zip
          test -f app/build.gradle || { echo "::error::app/build.gradle missing after unzip"; exit 1; }

      - name: Build APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-1.3
          path: app/build/outputs/apk/release/*.apk
