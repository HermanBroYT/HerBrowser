name: Android CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Unpack project (if the zip is in the repo)
        run: |
          if [ -f HerBrowser-project.zip ]; then
            rm -rf app/src app/build.gradle build.gradle settings.gradle gradle.properties
            unzip -q -o HerBrowser-project.zip
            echo "Project unpacked from HerBrowser-project.zip"
          fi
          test -f app/build.gradle || { echo "::error::app/build.gradle not found. Upload HerBrowser-project.zip to the repo root"; exit 1; }
      - name: Build APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
