name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Find or unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f HerBrowser-1.7.zip ]; then
            mkdir -p extracted
            unzip -q -o HerBrowser-1.7.zip -d extracted
          fi

          PROJECT_DIR=""
          for candidate in . extracted; do
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts"; then
              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -not -path './.github/*' -print -quit || true)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found. Put the project in the repository or add HerBrowser-1.7.zip."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleRelease --no-daemon

      - name: Package HerBrowser ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/release/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced. Check Gradle build logs."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/HerBrowser.apk
          (cd output && zip -q HerBrowser.zip HerBrowser.apk)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-APK
          path: output/HerBrowser.apk

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-ZIP
          path: output/HerBrowser.zip
