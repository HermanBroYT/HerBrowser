name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip
        id: chk
        shell: bash
        run: |
          if [ -f HerBrowser-Windows-1.7.zip ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "HerBrowser-Windows-1.7.zip not found: Windows build skipped"
          fi

      - name: Node 20
        if: steps.chk.outputs.have == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack project
        if: steps.chk.outputs.have == 'true'
        shell: pwsh
        run: Expand-Archive -Path HerBrowser-Windows-1.7.zip -DestinationPath winapp -Force

      - name: Install
        if: steps.chk.outputs.have == 'true'
        working-directory: winapp
        run: npm install --no-audit --no-fund

      - name: Build Windows app
        if: steps.chk.outputs.have == 'true'
        working-directory: winapp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Upload
        if: steps.chk.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HerBrowser-Windows-1.7
          path: winapp/dist/*.exe

      - name: Publish release with the installer
        if: steps.chk.outputs.have == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-1.7
          name: HerBrowser для Windows 1.7
          body: "Установщик HerBrowser-Setup-1.7.0.exe и портативная версия HerBrowser-1.7.0-portable.exe для Windows 10 и 11."
          files: winapp/dist/*.exe
