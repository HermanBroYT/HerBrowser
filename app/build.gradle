plugins {
    id 'com.android.application'
}

android {
    namespace 'com.herbrowser.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.herbrowser.app"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.5"
    }

    signingConfigs {
        release {
            def ks = rootProject.file("herbrowser.jks")
            def pw = System.getenv("KEY_PASSWORD")
            if (ks.exists() && pw) {
                storeFile ks
                storePassword pw
                keyAlias "herbrowser"
                keyPassword pw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ks = rootProject.file("herbrowser.jks")
            if (ks.exists() && System.getenv("KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "HerBrowser-1.5.apk"
        }
    }
}
